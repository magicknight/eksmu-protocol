name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  local-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-research.txt -r requirements-analysis.txt
      - name: Run all local checks (Python, UI, deployment helpers)
        run: python scripts/check_local.py
      - name: Verify the bundled chain witness
        run: python proof_bundle.py verify witness/chain-witness.json

  verifier-stdlib-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Zero-dependency verifier tests
        run: python -m unittest discover -s tests -p test_verify.py -v
